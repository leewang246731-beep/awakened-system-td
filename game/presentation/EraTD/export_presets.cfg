; Export presets for EraTD (T-096, F-141).
;
; Windows Desktop x86_64 release preset; PCK embedded into the exe
; (binary_format/embed_pck=true). The C# solution is built by the Godot
; export step itself (mono). Content JSONs live OUTSIDE res:// (D-02 keeps
; presentation/EraTD as the only res:// root) — tools/release/build_v010.sh
; stages game/content next to the exe, matching SimHost.FindContentDir's
; walk-up probe ("game/content/..." above the assembly base directory).
;
; ── Web preset (T-106, F-144/F-164) — ENGINE-BLOCKED, config ready ────────
; variant/thread_support=false is the F-144 contract: the threads-off
; package has NO SharedArrayBuffer/crossOriginIsolated dependency, so any
; static host serves it WITHOUT COOP/COEP headers. Godot 4.7.2-mono
; nonetheless REFUSES every Web export ("Exporting to Web is currently not
; supported in Godot 4 when using C#/.NET…") — verified 2026-10-15 by
; headless --export-release on this pinned editor (mono tpz ships NO web
; templates at all; upstream tracking godotengine/godot#70796). tools/
; release/build_web.sh therefore FAILS LOUDLY until an engine that supports
; C#→Web export is pinned; this preset is the ready-made threads-off
; configuration for that day (or for a future GDScript demo slice).
;
; ── Linux preset (T-107, F-145) — desktop x11/x86_64 release ─────────────
; Mirrors preset.0 (embed_pck, s3tc_bptc, x86_64) for the itch dual-platform
; zip: the mono tpz ships linux_release.x86_64 (verified in the pinned
; template dir), so this preset exports normally on the pinned editor.
; tools/release/build_v050.sh stages game/content + game/assets next to the
; binary (same walk-up probes as Windows) and ships start-game.sh instead of
; start-game.bat. Version face: v1.1.0 (W9 complete-face master — campaign menu, six eras, netplay, procedural, endless defaults).

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; Imported CC0 OGG stingers ship via the standard .import remap; the raw
; source path is NOT includable via include_filter (Godot skips raw copies
; of imported resources — tested in T-096), so AudioDirector loads them
; through ResourceLoader (remap-aware; see AudioDirector.cs T-096 note).
include_filter=""
exclude_filter=""
export_path="builds/EraTD.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

